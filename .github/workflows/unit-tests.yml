# unit-tests.yml: runs `make test-unit` (KOS-MIND-002). Not yet a required check: adding it to
# `required_github_checks` in .github/kritva-gate.json needs an owner-approved kritva-program pipeline update.
name: unit-tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Contract validator unit tests (standard library only)
        run: make test-unit
